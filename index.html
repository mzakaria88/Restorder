<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestOrder by NPN</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --danger: #EF4444;
            --danger-hover: #DC2828;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 2rem 1rem; 
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 800px;
        }

        h2 { margin-top: 0; margin-bottom: 1.5rem; color: var(--text-main); font-size: 1.5rem;}

        .input-row {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 15px;
            align-items: end;
            margin-bottom: 1.5rem;
        }

        .form-group { position: relative; display: flex; flex-direction: column; }
        
        label { font-weight: 600; margin-bottom: 6px; font-size: 0.875rem; color: var(--text-main); }
        
        input { 
            padding: 10px 12px; 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            font-size: 1rem; 
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button { 
            padding: 10px 16px; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #9CA3AF; cursor: not-allowed; }

        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger-hover); }
        
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background-color: var(--bg-color); }

        .btn-sm { padding: 6px 10px; font-size: 0.875rem; }

        .table-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        .table-header-actions h3 { margin: 0; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.95rem; 
        }
        
        th, td { 
            border-bottom: 1px solid var(--border); 
            padding: 12px 8px; 
            text-align: left; 
        }
        
        th { 
            background-color: var(--bg-color); 
            color: var(--text-muted); 
            font-weight: 600; 
            text-transform: uppercase; 
            font-size: 0.75rem; 
            letter-spacing: 0.05em;
        }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .inline-edit-input {
            width: 80px;
            padding: 6px;
            font-size: 0.9rem;
            margin-right: 8px;
        }

        .export-btn { width: 100%; margin-top: 2rem; padding: 12px; font-size: 1.1rem; }

        /* Autocomplete Styles */
        .autocomplete-items {
            position: absolute;
            border: 1px solid var(--border);
            border-radius: 6px;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 250px;
            overflow-y: auto;
            background-color: var(--card-bg);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-top: 4px;
        }
        
        .autocomplete-items div {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        
        .autocomplete-items div:last-child { border-bottom: none; }
        .autocomplete-items div:hover, .autocomplete-items div.active { background-color: var(--bg-color); }
        
        .item-name { font-weight: 600; color: var(--text-main); }
        .item-uom { font-size: 0.85em; color: var(--text-muted); margin-left: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>RestOrder by NPN</h2>

        <div class="input-row">
            <div class="form-group">
                <label for="searchInput">Search Item</label>
                <input type="text" id="searchInput" placeholder="Loading catalog..." disabled autocomplete="off">
                <input type="hidden" id="selectedSku">
                <div id="autocomplete-list" class="autocomplete-items"></div>
            </div>

            <div class="form-group">
                <label for="qtyInput">Quantity</label>
                <input type="number" id="qtyInput" placeholder="0.0" step="0.1" min="0.1">
            </div>

            <button onclick="addToCart()" id="addBtn">Add Item</button>
        </div>

        <div class="table-header-actions">
            <h3>Order List</h3>
            <button class="btn-sm btn-danger btn-outline" onclick="clearAllItems()">Clear Order</button>
        </div>

        <table id="cartTable">
            <thead>
                <tr>
                    <th>SKU</th>
                    <th>Item Name</th>
                    <th>Variant</th>
                    <th>Qty</th>
                    <th>UOM</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="cartBody">
                </tbody>
        </table>

        <button class="export-btn" onclick="exportToCSV()">Export Order to CSV</button>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQSJZsW8YEFBWTJLfDvCfBmVKrhKowYgaxtI7nd1cRLrj0-lG4sE8ufzhjcfjsE15JuU9llCN6BEifS/pub?output=csv'; 
        
        let catalogData = [];
        let orderCart = [];

        window.onload = async function() {
            try {
                const response = await fetch(sheetUrl + '&t=' + new Date().getTime());
                if (!response.ok) throw new Error("Network response failed");
                const csvText = await response.text();
                parseCSV(csvText);

                if (catalogData.length === 0) setupMockData();
            } catch (error) {
                setupMockData(); 
            }
        };

        function parseCSV(text) {
            catalogData = []; 
            const lines = text.split('\n');
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(',');
                const product = {
                    sku: cols[0] ? cols[0].trim() : '',
                    name: cols[1] ? cols[1].trim() : '',
                    variant: cols[2] ? cols[2].trim() : '',
                    uom: cols[3] ? cols[3].trim() : ''
                };
                if (product.name) catalogData.push(product);
            }
            
            const searchInput = document.getElementById('searchInput');
            if (catalogData.length > 0) {
                searchInput.placeholder = "Type to search items...";
                searchInput.disabled = false;
                searchInput.focus();
            } else {
                searchInput.placeholder = "Catalog is empty";
            }
        }

        function setupMockData() {
            const mockCSV = `SKU,Item Name,Variant,UOM\nN-001,nangka utk dimasak,Curah,kg\nT-001,tahu putih,Premium,pcs\nT-002,tahu curah,Standard,kg\nB-001,bawang merah,Brebes,kg\nA-001,ayam potong,Utuh,ekor\nC-001,cabai merah besar,Segar,kg\nC-002,cabai rawit merah,Super,kg\nB-002,bawang putih,Kating,kg\nS-001,santan kelapa,Murni,liter\nD-001,daging sapi,Rendang,kg\nB-003,beras,Pandan Wangi,kg\nM-001,minyak goreng,Kemasan,pouch\nT-003,telur ayam,Negeri,kg\nD-002,daun jeruk,Segar,ikat\nK-001,kecap manis,Refill,pouch`;
            parseCSV(mockCSV);
        }

        const searchInput = document.getElementById('searchInput');
        const qtyInput = document.getElementById('qtyInput');
        const autocompleteList = document.getElementById('autocomplete-list');
        const selectedSkuInput = document.getElementById('selectedSku');

        // Search Input Logic
        searchInput.addEventListener('input', function() {
            const val = this.value;
            autocompleteList.innerHTML = ''; 
            selectedSkuInput.value = ''; 

            if (!val) return false;

            const matches = catalogData.filter(item => {
                const searchString = `${item.name} ${item.variant} ${item.uom}`.toLowerCase();
                return searchString.includes(val.toLowerCase());
            });

            matches.forEach((item, index) => {
                const optionDiv = document.createElement("div");
                if (index === 0) optionDiv.classList.add('active'); // Highlight first by default
                
                optionDiv.innerHTML = `<span class="item-name">${item.name}</span> <span class="item-uom">(${item.uom})</span>`;
                
                optionDiv.addEventListener("click", function() {
                    selectItem(item);
                });
                
                autocompleteList.appendChild(optionDiv);
            });
        });

        // Keydown mapping for Enter Key
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const firstOption = autocompleteList.querySelector('div');
                if (firstOption) {
                    firstOption.click();
                }
            }
        });

        qtyInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addToCart();
            }
        });

        function selectItem(item) {
            searchInput.value = `${item.name} (${item.uom})`;
            selectedSkuInput.value = item.sku;
            autocompleteList.innerHTML = '';
            qtyInput.focus();
        }

        document.addEventListener("click", function (e) {
            if (e.target !== searchInput) autocompleteList.innerHTML = '';
        });

        // Cart Logic
        function addToCart() {
            const selectedSku = document.getElementById('selectedSku').value;
            const rawQty = parseFloat(qtyInput.value);

            if (!selectedSku) {
                alert("Please select an item from the search results.");
                searchInput.focus();
                return;
            }
            if (isNaN(rawQty) || rawQty <= 0) {
                alert("Please enter a valid quantity.");
                qtyInput.focus();
                return;
            }

            const formattedQty = Number.isInteger(rawQty) ? rawQty.toString() : rawQty.toFixed(2);
            const product = catalogData.find(p => p.sku === selectedSku);
            
            orderCart.push({
                sku: product.sku,
                name: product.name,
                variant: product.variant,
                qty: formattedQty,
                uom: product.uom
            });

            renderCart();
            
            searchInput.value = '';
            selectedSkuInput.value = '';
            qtyInput.value = '';
            searchInput.focus(); // Loop back to start
        }

        function renderCart() {
            const tbody = document.getElementById('cartBody');
            tbody.innerHTML = '';
            
            if (orderCart.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #6B7280; padding: 20px;">No items added yet.</td></tr>`;
                return;
            }

            orderCart.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.sku}</td>
                    <td>${item.name}</td>
                    <td>${item.variant}</td>
                    <td id="qty-cell-${index}">${item.qty}</td>
                    <td>${item.uom}</td>
                    <td class="actions-cell" id="action-cell-${index}">
                        <button class="btn-sm btn-outline" onclick="editItem(${index})">✏</button>
                        <button class="btn-sm btn-danger" onclick="deleteItem(${index})">🗑</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function clearAllItems() {
            if (orderCart.length > 0 && confirm("Are you sure you want to clear the entire order?")) {
                orderCart = [];
                renderCart();
            }
        }

        function deleteItem(index) {
            orderCart.splice(index, 1);
            renderCart();
        }

        function editItem(index) {
            const qtyCell = document.getElementById(`qty-cell-${index}`);
            const actionCell = document.getElementById(`action-cell-${index}`);
            const currentQty = orderCart[index].qty;

            qtyCell.innerHTML = `<input type="number" class="inline-edit-input" id="edit-qty-${index}" value="${currentQty}" step="0.1" min="0.1">`;
            actionCell.innerHTML = `
                <button class="btn-sm" style="background-color: #10B981;" onclick="saveItem(${index})">Save</button>
                <button class="btn-sm btn-outline" onclick="renderCart()">Cancel</button>
            `;

            const editInput = document.getElementById(`edit-qty-${index}`);
            editInput.focus();
            editInput.select();

            editInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') saveItem(index);
                if (e.key === 'Escape') renderCart();
            });
        }

        function saveItem(index) {
            const editInput = document.getElementById(`edit-qty-${index}`);
            const rawQty = parseFloat(editInput.value);

            if (isNaN(rawQty) || rawQty <= 0) {
                alert("Please enter a valid quantity.");
                editInput.focus();
                return;
            }

            orderCart[index].qty = Number.isInteger(rawQty) ? rawQty.toString() : rawQty.toFixed(2);
            renderCart();
        }

        function exportToCSV() {
            if (orderCart.length === 0) {
                alert("Your order is empty!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,SKU,Item Name,Variant,Qty,UOM\n";

            orderCart.forEach(item => {
                const safeName = `"${item.name.replace(/"/g, '""')}"`;
                const safeVariant = `"${item.variant.replace(/"/g, '""')}"`;
                let row = `${item.sku},${safeName},${safeVariant},${item.qty},${item.uom}`;
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "New_Order.csv");
            document.body.appendChild(link); 
            link.click();
            document.body.removeChild(link);
        }

        // Initial render to show empty state
        renderCart();
    </script>
</body>
</html>
