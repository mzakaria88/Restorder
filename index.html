<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestOrder by NPN</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --danger: #EF4444;
            --danger-hover: #DC2828;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 2rem 1rem; 
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 800px;
        }

        h2 { margin-top: 0; margin-bottom: 1.5rem; color: var(--text-main); font-size: 1.5rem;}

        .input-row {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 15px;
            align-items: end;
            margin-bottom: 1.5rem;
        }

        .form-group { position: relative; display: flex; flex-direction: column; }
        
        label { font-weight: 600; margin-bottom: 6px; font-size: 0.875rem; color: var(--text-main); }
        
        input { 
            padding: 10px 12px; 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            font-size: 1rem; 
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button { 
            padding: 10px 16px; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #9CA3AF; cursor: not-allowed; }

        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger-hover); }
        
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background-color: var(--bg-color); }

        .btn-sm { padding: 6px 10px; font-size: 0.875rem; }

        .table-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        .table-header-actions h3 { margin: 0; }

        .table-container {
            width: 100%;
            overflow-x: auto; /* Prevents table stretching on mobile */
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.95rem; 
            min-width: 400px; /* Ensure table elements don't crush completely */
        }
        
        th, td { 
            border-bottom: 1px solid var(--border); 
            padding: 12px 8px; 
            text-align: left; 
        }
        
        th { 
            background-color: var(--bg-color); 
            color: var(--text-muted); 
            font-weight: 600; 
            text-transform: uppercase; 
            font-size: 0.75rem; 
            letter-spacing: 0.05em;
        }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .inline-edit-input {
            width: 80px;
            padding: 6px;
            font-size: 0.9rem;
            margin-right: 8px;
        }

        .export-btn { width: 100%; margin-top: 2rem; padding: 12px; font-size: 1.1rem; }

        /* Autocomplete Styles */
        .autocomplete-items {
            position: absolute;
            border: 1px solid var(--border);
            border-radius: 6px;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 250px;
            overflow-y: auto;
            background-color: var(--card-bg);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-top: 4px;
        }
        
        .autocomplete-items div {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            border-left: 4px solid transparent; /* Placeholder for active border */
            transition: all 0.15s ease;
        }
        
        .autocomplete-items div:last-child { border-bottom: none; }
        
        /* Elevated Highlight Styling */
        .autocomplete-items div:hover, .autocomplete-items div.active { 
            background-color: #EEF2FF; 
            border-left: 4px solid var(--primary);
            padding-left: 8px; /* Offset the 4px border so text stays aligned */
        }
        
        .item-name { font-weight: 600; color: var(--text-main); transition: color 0.15s ease; }
        
        /* Make the item name text pop when highlighted */
        .autocomplete-items div:hover .item-name, .autocomplete-items div.active .item-name {
            color: var(--primary-hover);
        }

        .item-uom { font-size: 0.85em; color: var(--text-muted); margin-left: 4px; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .input-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>RestOrder by NPN</h2>

        <div class="input-row">
            <div class="form-group">
                <label for="searchInput">Search Item</label>
                <input type="text" id="searchInput" placeholder="Loading catalog..." disabled autocomplete="off">
                <input type="hidden" id="selectedSku">
                <div id="autocomplete-list" class="autocomplete-items"></div>
            </div>

            <div class="form-group">
                <label for="qtyInput">Quantity</label>
                <input type="number" id="qtyInput" placeholder="0.0" step="0.1" min="0.1">
            </div>

            <button onclick="addToCart()" id="addBtn">Add Item</button>
        </div>

        <div class="table-header-actions">
            <h3>Order List</h3>
            <button class="btn-sm btn-danger btn-outline" onclick="clearAllItems()">Clear Order</button>
        </div>

        <div class="table-container">
            <table id="cartTable">
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Qty</th>
                        <th>UOM</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="cartBody">
                </tbody>
            </table>
        </div>

        <button class="export-btn" onclick="exportToCSV()">Export Order to CSV</button>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQSJZsW8YEFBWTJLfDvCfBmVKrhKowYgaxtI7nd1cRLrj0-lG4sE8ufzhjcfjsE15JuU9llCN6BEifS/pub?output=csv'; 
        
        let catalogData = [];
        let orderCart = [];
        let currentFocus = -1;

        window.onload = async function() {
            try {
                const response = await fetch(sheetUrl + '&t=' + new Date().getTime());
                if (!response.ok) throw new Error("Network response failed");
                const csvText = await response.text();
                parseCSV(csvText);

                if (catalogData.length === 0) setupMockData();
            } catch (error) {
                setupMockData(); 
            }
        };

        function parseCSV(text) {
            catalogData = []; 
            const lines = text.split('\n');
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(',');
                const product = {
                    sku: cols[0] ? cols[0].trim() : '',
                    name: cols[1] ? cols[1].trim() : '',
                    variant: cols[2] ? cols[2].trim() : '',
                    uom: cols[3] ? cols[3].trim() : ''
                };
                if (product.name) catalogData.push(product);
            }
            
            const searchInput = document.getElementById('searchInput');
            if (catalogData.length > 0) {
                searchInput.placeholder = "Type to search items...";
                searchInput.disabled = false;
                searchInput.focus();
            } else {
                searchInput.placeholder = "Catalog is empty";
            }
        }

        function setupMockData() {
            const mockCSV = `SKU,Item Name,Variant,UOM\nN-001,nangka utk dimasak,Curah,kg\nT-001,tahu putih,Premium,pcs\nT-002,tahu curah,Standard,kg\nB-001,bawang merah,Brebes,kg\nA-001,ayam potong,Utuh,ekor\nC-001,cabai merah besar,Segar,kg\nC-002,cabai rawit merah,Super,kg\nB-002,bawang putih,Kating,kg\nS-001,santan kelapa,Murni,liter\nD-001,daging sapi,Rendang,kg\nB-003,beras,Pandan Wangi,kg\nM-001,minyak goreng,Kemasan,pouch\nT-003,telur ayam,Negeri,kg\nD-002,daun jeruk,Segar,ikat\nK-001,kecap manis,Refill,pouch`;
            parseCSV(mockCSV);
        }

        const searchInput = document.getElementById('searchInput');
        const qtyInput = document.getElementById('qtyInput');
        const autocompleteList = document.getElementById('autocomplete-list');
        const selectedSkuInput = document.getElementById('selectedSku');

        // Levenshtein distance for fuzzy matching typos
        function levenshtein(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    if (a[i - 1] === b[j - 1]) matrix[i][j] = matrix[i - 1][j - 1];
                    else matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
                }
            }
            return matrix[a.length][b.length];
        }

        // Generate match score (Highly Tolerant Subsequence & Typo Algorithm)
        function getMatchScore(query, text) {
            query = query.toLowerCase().trim();
            text = text.toLowerCase();
            
            if (!query) return 0;
            
            if (text === query) return 100; // Perfect match
            if (text.startsWith(query)) return 90; // Perfect start priority
            
            const words = text.split(/\s+/);
            if (words.some(w => w.startsWith(query))) return 80; // Word boundary match
            
            if (text.includes(query)) return 70; // Substring match

            // 1. Subsequence match (e.g., "thpth" matches "tahu putih")
            let qIdx = 0;
            for (let i = 0; i < text.length; i++) {
                if (query[qIdx] === text[i]) qIdx++;
                if (qIdx === query.length) return 60; // Tolerant subsequence match
            }

            // 2. High-tolerance Typo matching (Levenshtein)
            if (query.length > 2) {
                // Allow up to 2 typos for medium queries, 3 for longer queries
                const maxTypos = query.length <= 5 ? 2 : 3;
                
                // Check whole words against query
                for (let w of words) {
                    let dist = levenshtein(query, w);
                    if (dist <= maxTypos) return 50 - dist; 
                    
                    // Check prefix of the word (e.g. typing "nagnka" for "nangka")
                    let wordPrefix = w.substring(0, query.length);
                    if (wordPrefix.length >= query.length - maxTypos) {
                        let prefixDist = levenshtein(query, wordPrefix);
                        if (prefixDist <= maxTypos) return 40 - prefixDist;
                    }
                }
                
                // Check against the beginning of the entire text string
                let textPrefix = text.substring(0, query.length);
                let textDist = levenshtein(query, textPrefix);
                if (textDist <= maxTypos) return 30 - textDist;
            }
            
            return 0; // No match
        }

        // Search Input Logic
        searchInput.addEventListener('input', function() {
            const val = this.value;
            autocompleteList.innerHTML = ''; 
            selectedSkuInput.value = ''; 
            currentFocus = -1;

            if (!val) return false;

            // Score, filter, and sort matches
            let scoredMatches = catalogData.map(item => {
                const score = getMatchScore(val, item.name);
                return { item, score };
            }).filter(m => m.score > 0);

            scoredMatches.sort((a, b) => b.score - a.score);

            scoredMatches.forEach((match, index) => {
                const optionDiv = document.createElement("div");
                if (index === 0) {
                    optionDiv.classList.add('active'); // Highlight first by default
                    currentFocus = 0;
                }
                
                optionDiv.innerHTML = `<span class="item-name">${match.item.name}</span> <span class="item-uom">(${match.item.uom})</span>`;
                
                optionDiv.addEventListener("click", function() {
                    selectItem(match.item);
                });
                
                autocompleteList.appendChild(optionDiv);
            });
        });

        // Keydown mapping for Up, Down, Enter, Tab
        searchInput.addEventListener('keydown', function(e) {
            const items = autocompleteList.getElementsByTagName('div');
            
            if (e.key === 'ArrowDown') {
                currentFocus++;
                addActive(items);
            } else if (e.key === 'ArrowUp') {
                currentFocus--;
                addActive(items);
            } else if (e.key === 'Enter' || e.key === 'Tab') {
                if (items.length > 0) {
                    e.preventDefault(); // Prevent tab from jumping to next field immediately
                    if (currentFocus > -1) {
                        items[currentFocus].click();
                    } else {
                        items[0].click();
                    }
                }
            }
        });

        function addActive(items) {
            if (!items) return false;
            removeActive(items);
            if (currentFocus >= items.length) currentFocus = 0;
            if (currentFocus < 0) currentFocus = items.length - 1;
            items[currentFocus].classList.add('active');
            items[currentFocus].scrollIntoView({ block: 'nearest' });
        }

        function removeActive(items) {
            for (let i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
            }
        }

        qtyInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addToCart();
            }
        });

        function selectItem(item) {
            searchInput.value = `${item.name} (${item.uom})`;
            selectedSkuInput.value = item.sku;
            autocompleteList.innerHTML = '';
            qtyInput.focus();
        }

        document.addEventListener("click", function (e) {
            if (e.target !== searchInput) autocompleteList.innerHTML = '';
        });

        // Cart Logic
        function addToCart() {
            const selectedSku = document.getElementById('selectedSku').value;
            const rawQty = parseFloat(qtyInput.value);

            if (!selectedSku) {
                alert("Please select an item from the search results.");
                searchInput.focus();
                return;
            }
            if (isNaN(rawQty) || rawQty <= 0) {
                alert("Please enter a valid quantity.");
                qtyInput.focus();
                return;
            }

            const formattedQty = Number.isInteger(rawQty) ? rawQty.toString() : rawQty.toFixed(2);
            const product = catalogData.find(p => p.sku === selectedSku);
            
            orderCart.push({
                sku: product.sku,
                name: product.name,
                variant: product.variant,
                qty: formattedQty,
                uom: product.uom
            });

            renderCart();
            
            searchInput.value = '';
            selectedSkuInput.value = '';
            qtyInput.value = '';
            searchInput.focus(); // Loop back to start
        }

        function renderCart() {
            const tbody = document.getElementById('cartBody');
            tbody.innerHTML = '';
            
            if (orderCart.length === 0) {
                tbody.innerHTML = `<tr>
                    <td colspan="4" style="text-align: center; color: #6B7280; padding: 40px 20px;">
                        <img src="https://res.cloudinary.com/dmebrkcru/image/upload/f_auto,q_auto/baby_bear_white_bg_xq7e72" 
                             alt="Empty Cart" 
                             style="width: 150px; display: block; margin: 0 auto 15px auto; opacity: 0.8;">
                        No items added yet.
                    </td>
                </tr>`;
                return;
            }

            orderCart.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.name}</td>
                    <td id="qty-cell-${index}">${item.qty}</td>
                    <td>${item.uom}</td>
                    <td class="actions-cell" id="action-cell-${index}">
                        <button class="btn-sm btn-outline" onclick="editItem(${index})">✏</button>
                        <button class="btn-sm btn-danger" onclick="deleteItem(${index})">🗑</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function clearAllItems() {
            if (orderCart.length > 0 && confirm("Are you sure you want to clear the entire order?")) {
                orderCart = [];
                renderCart();
            }
        }

        function deleteItem(index) {
            orderCart.splice(index, 1);
            renderCart();
        }

        function editItem(index) {
            const qtyCell = document.getElementById(`qty-cell-${index}`);
            const actionCell = document.getElementById(`action-cell-${index}`);
            const currentQty = orderCart[index].qty;

            qtyCell.innerHTML = `<input type="number" class="inline-edit-input" id="edit-qty-${index}" value="${currentQty}" step="0.1" min="0.1">`;
            actionCell.innerHTML = `
                <button class="btn-sm" style="background-color: #10B981;" onclick="saveItem(${index})">Save</button>
                <button class="btn-sm btn-outline" onclick="renderCart()">Cancel</button>
            `;

            const editInput = document.getElementById(`edit-qty-${index}`);
            editInput.focus();
            editInput.select();

            editInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') saveItem(index);
                if (e.key === 'Escape') renderCart();
            });
        }

        function saveItem(index) {
            const editInput = document.getElementById(`edit-qty-${index}`);
            const rawQty = parseFloat(editInput.value);

            if (isNaN(rawQty) || rawQty <= 0) {
                alert("Please enter a valid quantity.");
                editInput.focus();
                return;
            }

            orderCart[index].qty = Number.isInteger(rawQty) ? rawQty.toString() : rawQty.toFixed(2);
            renderCart();
        }

        function exportToCSV() {
            if (orderCart.length === 0) {
                alert("Your order is empty!");
                return;
            }

            // Export still utilizes SKU and Variant data internally
            let csvContent = "data:text/csv;charset=utf-8,SKU,Item Name,Variant,Qty,UOM\n";

            orderCart.forEach(item => {
                const safeName = `"${item.name.replace(/"/g, '""')}"`;
                const safeVariant = `"${item.variant.replace(/"/g, '""')}"`;
                let row = `${item.sku},${safeName},${safeVariant},${item.qty},${item.uom}`;
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "New_Order.csv");
            document.body.appendChild(link); 
            link.click();
            document.body.removeChild(link);
        }

        // Initial render to show empty state
        renderCart();
    </script>
</body>
</html>
