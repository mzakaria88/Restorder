<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestOrder by NPN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca; --primary-light: #eef2ff;
            --success: #10b981; --success-hover: #059669; --danger: #f43f5e;
            --danger-hover: #e11d48; --danger-light: #fff1f2; --bg-color: #f8fafc;
            --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --border: #e2e8f0; --radius-lg: 12px; --radius-md: 8px; --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
        }

        body { 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color); color: var(--text-main); 
            padding: 1rem; margin: 0; display: flex; justify-content: center;
            align-items: flex-start; min-height: 100vh; line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background-color: var(--card-bg); padding: 1.25rem 1.75rem;
            border-radius: var(--radius-lg); box-shadow: var(--shadow-lg), 0 0 0 1px rgb(0 0 0 / 0.01);
            width: 100%; max-width: 950px;
        }

        .main-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px dashed var(--border); }
        .header-left { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .header-right { flex: 1; display: flex; justify-content: flex-end; align-items: flex-start; }

        h2 { margin: 0; color: var(--text-main); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
        h2::after { content: "App"; font-size: 0.7rem; text-transform: uppercase; background: var(--primary-light); color: var(--primary); padding: 1px 6px; border-radius: var(--radius-sm); font-weight: 600; letter-spacing: 0.05em; }

        .meta-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }

        .customer-section {
            font-size: 0.85rem; display: flex; align-items: center; gap: 6px; position: relative;
            background-color: var(--bg-color); padding: 4px 12px; border-radius: 30px; border: 1px solid var(--border); transition: all 0.2s ease;
        }
        .customer-section:hover { border-color: var(--text-muted); }

        .customer-label { font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 0.725rem; letter-spacing: 0.02em; }
        
        #customerDisplay, #deliveryDisplay { color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: none; transition: color 0.2s ease; }
        #customerDisplay:hover, #deliveryDisplay:hover { color: var(--primary-hover); }

        #customerEditBtn, #deliveryEditBtn { cursor: pointer; font-size: 0.8rem; filter: grayscale(100%); opacity: 0.6; transition: opacity 0.2s, filter 0.2s; }
        #customerEditBtn:hover, #deliveryEditBtn:hover { opacity: 1; filter: grayscale(0%); }

        #customerInputContainer, #deliveryInputContainer { display: none; position: relative; }
        #customerInput { padding: 2px 8px; border: 1px solid var(--primary); border-radius: var(--radius-sm); font-size: 0.85rem; width: 170px; outline: none; font-family: inherit; }

        /* Sticky Edit Mode UI */
        .edit-mode-container { 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; padding: 12px 20px; margin-bottom: 1.25rem; 
            background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(4px);
            border: 1px dashed var(--danger); border-radius: var(--radius-md); 
            position: sticky; top: 12px; z-index: 100; box-shadow: var(--shadow-lg); 
        }
        .edit-mode-label { font-size: 0.75rem; font-weight: 700; color: var(--danger); margin-bottom: 4px; letter-spacing: 0.02em; }
        .edit-mode-pill { background-color: var(--danger-light); border: 1px solid var(--danger); color: var(--danger); border-radius: 50px; padding: 4px 14px; font-size: 0.775rem; font-weight: 600; cursor: pointer; box-shadow: none; transition: all 0.2s ease; width: fit-content; }
        .edit-mode-pill:hover { background-color: #ffe4e6; transform: translateY(-1px); }

        .input-row { display: grid; grid-template-columns: 2.5fr 1fr auto; gap: 14px; align-items: end; margin-bottom: 1.25rem; background: var(--bg-color); padding: 1rem 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border); }
        .form-group { position: relative; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 6px; font-size: 0.825rem; color: var(--text-main); }
        input { padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.925rem; font-family: inherit; color: var(--text-main); background-color: var(--card-bg); transition: border-color 0.2s, box-shadow 0.2s; outline: none; box-shadow: var(--shadow-sm); }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15), var(--shadow-sm); }
        input::placeholder { color: #94a3b8; }

        button { padding: 9px 16px; background-color: var(--primary); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.925rem; font-weight: 600; font-family: inherit; transition: all 0.2s ease; box-shadow: var(--shadow-sm); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:disabled { background-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; transform: none; }

        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: var(--success-hover); }
        
        .btn-outline { background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); box-shadow: var(--shadow-sm); }
        .btn-outline:hover { background-color: var(--bg-color); color: var(--text-main); border-color: var(--text-muted); }
        .btn-sm { padding: 4px 10px; font-size: 0.825rem; border-radius: var(--radius-sm); height: 28px; }

        .table-header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .table-header-actions h3 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
        .table-container { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); background-color: var(--card-bg); }

        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.925rem; min-width: 600px; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: #f8fafc; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.725rem; letter-spacing: 0.05em; border-bottom: 2px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f8fafc; }

        .actions-cell { display: flex; gap: 4px; }
        .inline-edit-input { width: 65px; padding: 2px 6px; font-size: 0.875rem; margin-right: 4px; box-shadow: none; }
        .note-cell { max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); font-size: 0.85rem; font-style: italic; }

        .export-btn { width: 100%; margin-top: 1.5rem; padding: 11px; font-size: 1rem; font-weight: 700; background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%); border-radius: var(--radius-md); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15); }
        .export-btn:hover { box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25); transform: translateY(-1px); }

        .autocomplete-items { position: absolute; border: 1px solid var(--border); border-radius: var(--radius-md); z-index: 99; top: 100%; left: 0; right: 0; max-height: 240px; overflow-y: auto; background-color: var(--card-bg); box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0,0,0,0.05); margin-top: 4px; padding: 4px; }
        .autocomplete-items:empty { display: none; border: none; padding: 0; }
        .autocomplete-items div { padding: 8px 12px; cursor: pointer; border-radius: var(--radius-sm); transition: all 0.15s ease; font-size: 0.9rem; margin-bottom: 2px; display: flex; align-items: center; justify-content: space-between; }
        .autocomplete-items div:last-child { margin-bottom: 0; }
        .autocomplete-items div:hover, .autocomplete-items div.active { background-color: var(--primary-light); color: var(--primary-hover); padding-left: 14px; }
        .item-name { font-weight: 500; color: var(--text-main); }
        .autocomplete-items div:hover .item-name, .autocomplete-items div.active .item-name { color: var(--primary); }
        .item-uom { font-size: 0.775rem; color: var(--text-muted); background: var(--bg-color); padding: 1px 5px; border-radius: 4px; font-weight: 600; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(15, 23, 42, 0.4); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); animation: fadeIn 0.2s ease-out; }
        .modal-content { background-color: var(--card-bg); padding: 1.75rem; border-radius: var(--radius-lg); width: 95%; max-width: 580px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15); border: 1px solid var(--border); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
        .modal-header h3 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em;}
        .close-btn { background: var(--bg-color); color: var(--text-muted); border-radius: 50%; width: 28px; height: 28px; padding: 0; font-size: 1.15rem; cursor: pointer; line-height: 1; box-shadow: none; }
        .close-btn:hover { color: var(--danger); background: var(--danger-light); transform: none;}
        .history-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); transition: all 0.2s ease; background-color: var(--bg-color); }
        .history-item:hover { border-color: var(--primary); background-color: var(--card-bg); box-shadow: var(--shadow-sm); }
        
        /* Clickable History Rows */
        .history-item-details { display: flex; flex-direction: column; gap: 4px; cursor: pointer; flex: 1; transition: color 0.2s; }
        .history-item-details:hover .history-item-time { color: var(--primary); }
        .history-item-time { font-weight: 600; font-size: 0.925rem; color: var(--text-main); }
        .history-item-sub { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 6px; align-items: center;}

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 680px) {
            body { padding: 0.5rem; }
            .container { padding: 1rem; }
            .main-header { flex-direction: column; gap: 12px; align-items: stretch; }
            .header-right { justify-content: flex-start; } 
            .input-row { grid-template-columns: 1fr; gap: 12px; padding: 0.75rem; }
            button { width: 100%; }
            .btn-sm { width: auto; }
            .actions-cell { width: max-content; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

    <div class="container">
        <div class="main-header">
            <div class="header-left">
                <h2>RestOrder by NPN</h2>
                
                <div class="meta-chips">
                    <div class="customer-section">
                        <span class="customer-label">Customer:</span>
                        <span id="customerDisplay" onclick="openCustomerSearch()">click here</span>
                        <span id="customerEditBtn" style="display:none;" onclick="openCustomerSearch()">✏️</span>
                        
                        <div id="customerInputContainer">
                            <input type="text" id="customerInput" placeholder="Search customer..." autocomplete="off">
                            <div id="customer-autocomplete-list" class="autocomplete-items"></div>
                        </div>
                    </div>

                    <div class="customer-section">
                        <span class="customer-label">Delivery:</span>
                        <span id="deliveryDisplay" onclick="openDeliveryEdit()"></span>
                        <span id="deliveryEditBtn" onclick="openDeliveryEdit()">✏️</span>
                        
                        <div id="deliveryInputContainer" style="display: none; align-items: center; gap: 6px;">
                            <input type="date" id="deliveryInput" style="padding: 2px 6px; border: 1px solid var(--primary); border-radius: var(--radius-sm); font-size: 0.85rem; outline: none; font-family: inherit;">
                            <button id="deliverySaveBtn" class="btn-sm" style="padding: 0 10px;" onclick="saveDeliveryDate()">Save</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="header-right">
                <button class="btn-sm btn-outline" onclick="openHistoryPopup()">🕒 History</button>
            </div>
        </div>

        <div id="editModeContainer" class="edit-mode-container">
            <span id="editModeLabel" class="edit-mode-label">Edit Mode for ROXXXXXX</span>
            <button onclick="resetAppUI()" class="edit-mode-pill">Buat pesanan baru saja</button>
        </div>

        <div class="input-row">
            <div class="form-group">
                <label for="searchInput">Search Item</label>
                <input type="text" id="searchInput" placeholder="Loading catalog..." disabled autocomplete="off">
                <input type="hidden" id="selectedSku">
                <div id="autocomplete-list" class="autocomplete-items"></div>
            </div>

            <div class="form-group">
                <label for="qtyInput">Quantity</label>
                <input type="number" id="qtyInput" placeholder="0.0" step="0.1" min="0.1">
            </div>

            <button onclick="addToCart()" id="addBtn">Add Item</button>
        </div>

        <div class="table-header-actions">
            <h3>Order List</h3>
            <button class="btn-sm btn-danger btn-outline" onclick="clearAllItems()">Clear Order</button>
        </div>

        <div class="table-container">
            <table id="cartTable">
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">No.</th>
                        <th>Item Name</th>
                        <th style="width: 90px;">Qty</th>
                        <th style="width: 80px;">UOM</th>
                        <th>Note</th>
                        <th style="width: 150px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="cartBody">
                </tbody>
            </table>
        </div>

        <button class="export-btn" onclick="submitOrder()">Submit Order</button>
    </div>

    <div id="historyModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Transaction History</h3>
                <button class="close-btn" onclick="closeHistoryPopup()">&times;</button>
            </div>
            <div id="historyList" class="history-list">
            </div>
        </div>
    </div>

    <script>
        // --- Configuration URLs ---
        const itemSheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQSJZsW8YEFBWTJLfDvCfBmVKrhKowYgaxtI7nd1cRLrj0-lG4sE8ufzhjcfjsE15JuU9llCN6BEifS/pub?output=csv'; 
        const customerSheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOr3QPD1cMK99O5WMN1AIUcXd4ZXWBbnZKCBXYkDdgHJUsW3L7Kqt0myWtUb-eD1KsNa9if1URXjOx/pub?output=csv'; 
        const GAS_DB_URL = 'https://script.google.com/macros/s/AKfycbyrPvMpFQWX5w-G9YZctb8jxVnWPtClAqnyYFkTyaLaV0KVeKfKvTmMDBPdbXZGu3s/exec';
        const GAS_SHEET_SYNC_URL = 'https://script.google.com/macros/s/AKfycbzFMSOLEqRnawcP3_uHY-NbZQj3N9L0gEoOjII363emt4MM0Xv19obQmwK8_GqSntk/exec';
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxqWGZWEFBkp2XcKlG7PeLDx9g2l6-rEgAEaWaP829fdIAS-91BltBaTnepewpBH_Hr/exec'; 
        const TELEGRAM_CHAT_ID = '-1004295283262';

        let catalogData = [];
        let customerDataList = [];
        let orderCart = [];
        let currentCustomer = null;
        let currentFocusItem = -1;
        let currentFocusCustomer = -1;
        
        let transactionHistory = JSON.parse(localStorage.getItem('npn_order_history')) || [];
        let currentOrderNumber = null;

        function syncOrderToLampohSheet(transactionData) {
            if (!GAS_SHEET_SYNC_URL || GAS_SHEET_SYNC_URL.includes('PASTE_NEW_SCRIPT')) return;
            fetch(GAS_SHEET_SYNC_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(transactionData)
             })
            .then(res => console.log("Google Sheet sync payload dispatched successfully."))
            .catch(err => console.error("Sheet sync failed", err));
        }

        function getTomorrowDateString() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const y = tomorrow.getFullYear();
            const m = String(tomorrow.getMonth() + 1).padStart(2, '0');
            const d = String(tomorrow.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatDateDisplay(dateString) {
            if (!dateString) return "";
            let dLocal;
            if (dateString.length === 10 && dateString.indexOf('-') === 4) {
                const parts = dateString.split('-');
                dLocal = new Date(parts[0], parts[1] - 1, parts[2]);
            } else {
                dLocal = new Date(dateString);
            }
            if (isNaN(dLocal.getTime())) return dateString;
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const dd = String(dLocal.getDate()).padStart(2, '0');
            const mmm = months[dLocal.getMonth()];
            const yyyy = dLocal.getFullYear();
            return `${dd} ${mmm} ${yyyy}`;
        }

        let currentDeliveryDate = getTomorrowDateString();
        
        const deliveryDisplay = document.getElementById('deliveryDisplay');
        const deliveryEditBtn = document.getElementById('deliveryEditBtn');
        const deliveryInputContainer = document.getElementById('deliveryInputContainer');
        const deliveryInput = document.getElementById('deliveryInput');

        function updateDeliveryDisplay() { deliveryDisplay.innerText = formatDateDisplay(currentDeliveryDate); }

        function openDeliveryEdit() {
            deliveryDisplay.style.display = 'none'; deliveryEditBtn.style.display = 'none'; deliveryInputContainer.style.display = 'flex';
            let isoDate = currentDeliveryDate;
            if
