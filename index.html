<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestOrder by NPN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca; --primary-light: #eef2ff;
            --success: #10b981; --success-hover: #059669; --danger: #f43f5e;
            --danger-hover: #e11d48; --danger-light: #fff1f2; --bg-color: #f8fafc;
            --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --border: #e2e8f0; --radius-lg: 12px; --radius-md: 8px; --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
        }

        body { 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color); color: var(--text-main); 
            padding: 1rem; margin: 0; display: flex; justify-content: center;
            align-items: flex-start; min-height: 100vh; line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background-color: var(--card-bg); padding: 1.25rem 1.75rem;
            border-radius: var(--radius-lg); box-shadow: var(--shadow-lg), 0 0 0 1px rgb(0 0 0 / 0.01);
            width: 100%; max-width: 950px;
        }

        .main-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px dashed var(--border); }
        .header-left { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .header-right { flex: 1; display: flex; justify-content: flex-end; align-items: flex-start; }

        h2 { margin: 0; color: var(--text-main); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
        h2::after { content: "App"; font-size: 0.7rem; text-transform: uppercase; background: var(--primary-light); color: var(--primary); padding: 1px 6px; border-radius: var(--radius-sm); font-weight: 600; letter-spacing: 0.05em; }

        .meta-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }

        .customer-section {
            font-size: 0.85rem; display: flex; align-items: center; gap: 6px; position: relative;
            background-color: var(--bg-color); padding: 4px 12px; border-radius: 30px; border: 1px solid var(--border); transition: all 0.2s ease;
        }
        .customer-section:hover { border-color: var(--text-muted); }

        .customer-label { font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 0.725rem; letter-spacing: 0.02em; }
        
        #customerDisplay, #deliveryDisplay { color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: none; transition: color 0.2s ease; }
        #customerDisplay:hover, #deliveryDisplay:hover { color: var(--primary-hover); }

        #customerEditBtn, #deliveryEditBtn { cursor: pointer; font-size: 0.8rem; filter: grayscale(100%); opacity: 0.6; transition: opacity 0.2s, filter 0.2s; }
        #customerEditBtn:hover, #deliveryEditBtn:hover { opacity: 1; filter: grayscale(0%); }

        #customerInputContainer, #deliveryInputContainer { display: none; position: relative; }
        #customerInput { padding: 2px 8px; border: 1px solid var(--primary); border-radius: var(--radius-sm); font-size: 0.85rem; width: 170px; outline: none; font-family: inherit; }

        /* Edit Mode UI */
        .edit-mode-container { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1.5; text-align: center; padding: 0 10px; }
        .edit-mode-label { font-size: 0.75rem; font-weight: 700; color: var(--danger); margin-bottom: 4px; letter-spacing: 0.02em; }
        .edit-mode-pill { background-color: var(--danger-light); border: 1px solid var(--danger); color: var(--danger); border-radius: 50px; padding: 4px 14px; font-size: 0.775rem; font-weight: 600; cursor: pointer; box-shadow: none; transition: all 0.2s ease; width: fit-content; }
        .edit-mode-pill:hover { background-color: #ffe4e6; transform: translateY(-1px); }

        .input-row { display: grid; grid-template-columns: 2.5fr 1fr auto; gap: 14px; align-items: end; margin-bottom: 1.25rem; background: var(--bg-color); padding: 1rem 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border); }
        .form-group { position: relative; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 6px; font-size: 0.825rem; color: var(--text-main); }
        input { padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.925rem; font-family: inherit; color: var(--text-main); background-color: var(--card-bg); transition: border-color 0.2s, box-shadow 0.2s; outline: none; box-shadow: var(--shadow-sm); }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15), var(--shadow-sm); }
        input::placeholder { color: #94a3b8; }

        button { padding: 9px 16px; background-color: var(--primary); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.925rem; font-weight: 600; font-family: inherit; transition: all 0.2s ease; box-shadow: var(--shadow-sm); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:disabled { background-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; transform: none; }

        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: var(--success-hover); }
        
        .btn-outline { background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); box-shadow: var(--shadow-sm); }
        .btn-outline:hover { background-color: var(--bg-color); color: var(--text-main); border-color: var(--text-muted); }
        .btn-sm { padding: 4px 10px; font-size: 0.825rem; border-radius: var(--radius-sm); height: 28px; }

        .table-header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .table-header-actions h3 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
        .table-container { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); background-color: var(--card-bg); }

        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.925rem; min-width: 600px; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: #f8fafc; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.725rem; letter-spacing: 0.05em; border-bottom: 2px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f8fafc; }

        .actions-cell { display: flex; gap: 4px; }
        .inline-edit-input { width: 65px; padding: 2px 6px; font-size: 0.875rem; margin-right: 4px; box-shadow: none; }
        .note-cell { max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); font-size: 0.85rem; font-style: italic; }

        .export-btn { width: 100%; margin-top: 1.5rem; padding: 11px; font-size: 1rem; font-weight: 700; background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%); border-radius: var(--radius-md); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15); }
        .export-btn:hover { box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25); transform: translateY(-1px); }

        .autocomplete-items { position: absolute; border: 1px solid var(--border); border-radius: var(--radius-md); z-index: 99; top: 100%; left: 0; right: 0; max-height: 240px; overflow-y: auto; background-color: var(--card-bg); box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0,0,0,0.05); margin-top: 4px; padding: 4px; }
        .autocomplete-items:empty { display: none; border: none; padding: 0; }
        .autocomplete-items div { padding: 8px 12px; cursor: pointer; border-radius: var(--radius-sm); transition: all 0.15s ease; font-size: 0.9rem; margin-bottom: 2px; display: flex; align-items: center; justify-content: space-between; }
        .autocomplete-items div:last-child { margin-bottom: 0; }
        .autocomplete-items div:hover, .autocomplete-items div.active { background-color: var(--primary-light); color: var(--primary-hover); padding-left: 14px; }
        .item-name { font-weight: 500; color: var(--text-main); }
        .autocomplete-items div:hover .item-name, .autocomplete-items div.active .item-name { color: var(--primary); }
        .item-uom { font-size: 0.775rem; color: var(--text-muted); background: var(--bg-color); padding: 1px 5px; border-radius: 4px; font-weight: 600; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(15, 23, 42, 0.4); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); animation: fadeIn 0.2s ease-out; }
        .modal-content { background-color: var(--card-bg); padding: 1.75rem; border-radius: var(--radius-lg); width: 90%; max-width: 530px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15); border: 1px solid var(--border); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
        .modal-header h3 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em;}
        .close-btn { background: var(--bg-color); color: var(--text-muted); border-radius: 50%; width: 28px; height: 28px; padding: 0; font-size: 1.15rem; cursor: pointer; line-height: 1; box-shadow: none; }
        .close-btn:hover { color: var(--danger); background: var(--danger-light); transform: none;}
        .history-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); transition: all 0.2s ease; background-color: var(--bg-color); }
        .history-item:hover { border-color: var(--primary); background-color: var(--card-bg); box-shadow: var(--shadow-sm); }
        .history-item-details { display: flex; flex-direction: column; gap: 4px; }
        .history-item-time { font-weight: 600; font-size: 0.925rem; color: var(--text-main); }
        .history-item-sub { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 6px; align-items: center;}

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 680px) {
            body { padding: 0.5rem; }
            .container { padding: 1rem; }
            .main-header { flex-direction: column; gap: 12px; align-items: stretch; }
            .header-right { justify-content: flex-start; } 
            .edit-mode-container { order: 3; width: 100%; margin-top: 6px; padding-top: 12px; border-top: 1px dashed var(--border); }
            .input-row { grid-template-columns: 1fr; gap: 12px; padding: 0.75rem; }
            button { width: 100%; }
            .btn-sm { width: auto; }
            .actions-cell { width: max-content; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-header">
            <div class="header-left">
                <h2>RestOrder by NPN</h2>
                
                <div class="meta-chips">
                    <div class="customer-section">
                        <span class="customer-label">Customer:</span>
                        <span id="customerDisplay" onclick="openCustomerSearch()">click here</span>
                        <span id="customerEditBtn" style="display:none;" onclick="openCustomerSearch()">✏️</span>
                        
                        <div id="customerInputContainer">
                            <input type="text" id="customerInput" placeholder="Search customer..." autocomplete="off">
                            <div id="customer-autocomplete-list" class="autocomplete-items"></div>
                        </div>
                    </div>

                    <div class="customer-section">
                        <span class="customer-label">Delivery:</span>
                        <span id="deliveryDisplay" onclick="openDeliveryEdit()"></span>
                        <span id="deliveryEditBtn" onclick="openDeliveryEdit()">✏️</span>
                        
                        <div id="deliveryInputContainer" style="display: none; align-items: center; gap: 6px;">
                            <input type="date" id="deliveryInput" style="padding: 2px 6px; border: 1px solid var(--primary); border-radius: var(--radius-sm); font-size: 0.85rem; outline: none; font-family: inherit;">
                            <button id="deliverySaveBtn" class="btn-sm" style="padding: 0 10px;" onclick="saveDeliveryDate()">Save</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="editModeContainer" class="edit-mode-container">
                <span id="editModeLabel" class="edit-mode-label">Edit Mode for ROXXXXXX</span>
                <button onclick="resetAppUI()" class="edit-mode-pill">Buat pesanan baru saja</button>
            </div>

            <div class="header-right">
                <button class="btn-sm btn-outline" onclick="openHistoryPopup()">🕒 History</button>
            </div>
        </div>

        <div class="input-row">
            <div class="form-group">
                <label for="searchInput">Search Item</label>
                <input type="text" id="searchInput" placeholder="Loading catalog..." disabled autocomplete="off">
                <input type="hidden" id="selectedSku">
                <div id="autocomplete-list" class="autocomplete-items"></div>
            </div>

            <div class="form-group">
                <label for="qtyInput">Quantity</label>
                <input type="number" id="qtyInput" placeholder="0.0" step="0.1" min="0.1">
            </div>

            <button onclick="addToCart()" id="addBtn">Add Item</button>
        </div>

        <div class="table-header-actions">
            <h3>Order List</h3>
            <button class="btn-sm btn-danger btn-outline" onclick="clearAllItems()">Clear Order</button>
        </div>

        <div class="table-container">
            <table id="cartTable">
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">No.</th>
                        <th>Item Name</th>
                        <th style="width: 90px;">Qty</th>
                        <th style="width: 80px;">UOM</th>
                        <th>Note</th>
                        <th style="width: 150px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="cartBody">
                </tbody>
            </table>
        </div>

        <button class="export-btn" onclick="submitOrder()">Submit Order</button>
    </div>

    <div id="historyModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Transaction History</h3>
                <button class="close-btn" onclick="closeHistoryPopup()">&times;</button>
            </div>
            <div id="historyList" class="history-list">
            </div>
        </div>
    </div>

    <script>
        // --- Configuration URLs ---
        const itemSheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQSJZsW8YEFBWTJLfDvCfBmVKrhKowYgaxtI7nd1cRLrj0-lG4sE8ufzhjcfjsE15JuU9llCN6BEifS/pub?output=csv'; 
        const customerSheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOr3QPD1cMK99O5WMN1AIUcXd4ZXWBbnZKCBXYkDdgHJUsW3L7Kqt0myWtUb-eD1KsNa9if1URXjOx/pub?output=csv'; 
        const GAS_DB_URL = 'https://script.google.com/macros/s/AKfycbxqD7HRpXVoRmMYibgmlJgOdgv7SWxclSLimGYgv8s5pnTJJebuUYQcH7Af3rbmMQ/exec';
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxqWGZWEFBkp2XcKlG7PeLDx9g2l6-rEgAEaWaP829fdIAS-91BltBaTnepewpBH_Hr/exec'; 
        const TELEGRAM_CHAT_ID = '-1004295283262';

        let catalogData = [];
        let customerDataList = [];
        let orderCart = [];
        let currentCustomer = null;
        let currentFocusItem = -1;
        let currentFocusCustomer = -1;
        
        let transactionHistory = JSON.parse(localStorage.getItem('npn_order_history')) || [];
        let currentOrderNumber = null;

        function getTomorrowDateString() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const y = tomorrow.getFullYear();
            const m = String(tomorrow.getMonth() + 1).padStart(2, '0');
            const d = String(tomorrow.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatDateDisplay(dateString) {
            if (!dateString) return "";
            
            let dLocal;
            if (dateString.length === 10 && dateString.indexOf('-') === 4) {
                const parts = dateString.split('-');
                dLocal = new Date(parts[0], parts[1] - 1, parts[2]);
            } else {
                dLocal = new Date(dateString);
            }

            if (isNaN(dLocal.getTime())) return dateString;

            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const dd = String(dLocal.getDate()).padStart(2, '0');
            const mmm = months[dLocal.getMonth()];
            const yyyy = dLocal.getFullYear();
            
            return `${dd} ${mmm} ${yyyy}`;
        }

        let currentDeliveryDate = getTomorrowDateString();
        
        const deliveryDisplay = document.getElementById('deliveryDisplay');
        const deliveryEditBtn = document.getElementById('deliveryEditBtn');
        const deliveryInputContainer = document.getElementById('deliveryInputContainer');
        const deliveryInput = document.getElementById('deliveryInput');

        function updateDeliveryDisplay() { deliveryDisplay.innerText = formatDateDisplay(currentDeliveryDate); }

        function openDeliveryEdit() {
            deliveryDisplay.style.display = 'none';
            deliveryEditBtn.style.display = 'none';
            deliveryInputContainer.style.display = 'flex';
            
            let isoDate = currentDeliveryDate;
            if (currentDeliveryDate.length !== 10) {
                const d = new Date(currentDeliveryDate);
                if (!isNaN(d.getTime())) {
                    const yyyy = d.getFullYear();
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const dd = String(d.getDate()).padStart(2, '0');
                    isoDate = `${yyyy}-${mm}-${dd}`;
                }
            }
            
            deliveryInput.value = isoDate;
            deliveryInput.focus();
        }

        function saveDeliveryDate() {
            if (deliveryInput.value) { currentDeliveryDate = deliveryInput.value; }
            deliveryInputContainer.style.display = 'none';
            deliveryDisplay.style.display = 'inline-block';
            deliveryEditBtn.style.display = 'inline-block';
            updateDeliveryDisplay();
        }

        deliveryInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') saveDeliveryDate();
            if (e.key === 'Escape') {
                deliveryInputContainer.style.display = 'none';
                deliveryDisplay.style.display = 'inline-block';
                deliveryEditBtn.style.display = 'inline-block';
            }
        });

        updateDeliveryDisplay(); 

        window.onload = async function() {
            try {
                const response = await fetch(itemSheetUrl + '&t=' + new Date().getTime());
                if (response.ok) {
                    const csvText = await response.text();
                    parseItemCSV(csvText);
                }
            } catch (error) { console.error(error); }

            try {
                if(customerSheetUrl) {
                    const response = await fetch(customerSheetUrl + '&t=' + new Date().getTime());
                    if (response.ok) {
                        const csvText = await response.text();
                        parseCustomerCSV(csvText);
                    }
                }
            } catch (error) { console.error(error); }

            if (GAS_DB_URL && !GAS_DB_URL.includes('PASTE_YOUR')) {
                try {
                    const response = await fetch(GAS_DB_URL);
                    const data = await response.json();
                    if (data && Array.isArray(data) && data.length > 0) {
                        transactionHistory = data;
                        localStorage.setItem('npn_order_history', JSON.stringify(transactionHistory));
                    }
                } catch (error) {
                    console.error("Failed to load history from DB, using local cache", error);
                }
            }
        };

        function parseItemCSV(text) {
            catalogData = []; 
            const lines = text.split('\n');
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(',');
                const product = {
                    sku: cols[0] ? cols[0].trim() : '', name: cols[1] ? cols[1].trim() : '',
                    variant: cols[2] ? cols[2].trim() : '', uom: cols[3] ? cols[3].trim() : ''
                };
                if (product.name) catalogData.push(product);
            }
            
            const searchInput = document.getElementById('searchInput');
            if (catalogData.length > 0) {
                searchInput.placeholder = "Type to search items..."; searchInput.disabled = false;
            } else { searchInput.placeholder = "Catalog is empty"; }
        }

        function parseCustomerCSV(text) {
            customerDataList = [];
            const lines = text.split('\n');
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(',');
                const customerName = cols[0] ? cols[0].trim() : ''; 
                if (customerName) customerDataList.push(customerName);
            }
        }

        function levenshtein(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    if (a[i - 1] === b[j - 1]) matrix[i][j] = matrix[i - 1][j - 1];
                    else matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
                }
            }
            return matrix[a.length][b.length];
        }

        function getMatchScore(query, text) {
            query = query.toLowerCase().trim(); text = text.toLowerCase();
            if (!query) return 0; if (text === query) return 100; if (text.startsWith(query)) return 90;
            const words = text.split(/\s+/); if (words.some(w => w.startsWith(query))) return 80; 
            if (text.includes(query)) return 70;

            let qIdx = 0;
            for (let i = 0; i < text.length; i++) {
                if (query[qIdx] === text[i]) qIdx++;
                if (qIdx === query.length) return 60;
            }

            if (query.length > 2) {
                const maxTypos = query.length <= 5 ? 2 : 3;
                for (let w of words) {
                    let dist = levenshtein(query, w); if (dist <= maxTypos) return 50 - dist; 
                    let wordPrefix = w.substring(0, query.length);
                    if (wordPrefix.length >= query.length - maxTypos) {
                        let prefixDist = levenshtein(query, wordPrefix);
                        if (prefixDist <= maxTypos) return 40 - prefixDist;
                    }
                }
                let textPrefix = text.substring(0, query.length);
                let textDist = levenshtein(query, textPrefix);
                if (textDist <= maxTypos) return 30 - textDist;
            }
            return 0; 
        }

        function addActive(items, focusVar) {
            if (!items) return focusVar;
            for (let i = 0; i < items.length; i++) items[i].classList.remove('active');
            if (focusVar >= items.length) focusVar = 0; if (focusVar < 0) focusVar = items.length - 1;
            items[focusVar].classList.add('active'); items[focusVar].scrollIntoView({ block: 'nearest' });
            return focusVar;
        }

        const customerInput = document.getElementById('customerInput');
        const customerAutocompleteList = document.getElementById('customer-autocomplete-list');
        const customerDisplay = document.getElementById('customerDisplay');
        const customerEditBtn = document.getElementById('customerEditBtn');
        const customerInputContainer = document.getElementById('customerInputContainer');

        function openCustomerSearch() {
            customerDisplay.style.display = 'none'; customerEditBtn.style.display = 'none';
            customerInputContainer.style.display = 'block'; customerInput.value = ''; customerInput.focus();
            populateCustomerDropdown('');
        }

        function selectCustomer(name) {
            currentCustomer = name; customerDisplay.innerText = name; customerDisplay.style.display = 'inline-block';
            customerDisplay.style.textDecoration = 'none'; customerDisplay.style.color = 'var(--text-main)';
            customerEditBtn.style.display = 'inline-block'; customerInputContainer.style.display = 'none';
            customerAutocompleteList.innerHTML = '';
        }

        function populateCustomerDropdown(query) {
            customerAutocompleteList.innerHTML = ''; currentFocusCustomer = -1;
            let matches = [];
            if (!query) { matches = customerDataList.slice(0, 15).map(name => ({ name, score: 100 })); } 
            else {
                matches = customerDataList.map(name => { return { name, score: getMatchScore(query, name) }; }).filter(m => m.score > 0);
                matches.sort((a, b) => b.score - a.score);
            }
            matches.forEach((match, index) => {
                const optionDiv = document.createElement("div");
                if (index === 0 && query) { optionDiv.classList.add('active'); currentFocusCustomer = 0; }
                optionDiv.innerHTML = `<span class="item-name">${match.name}</span>`;
                optionDiv.addEventListener("click", () => selectCustomer(match.name));
                customerAutocompleteList.appendChild(optionDiv);
            });
        }

        customerInput.addEventListener('input', function() { populateCustomerDropdown(this.value); });
        customerInput.addEventListener('keydown', function(e) {
            const items = customerAutocompleteList.getElementsByTagName('div');
            if (e.key === 'ArrowDown') { currentFocusCustomer = addActive(items, ++currentFocusCustomer); }
            else if (e.key === 'ArrowUp') { currentFocusCustomer = addActive(items, --currentFocusCustomer); }
            else if (e.key === 'Enter' || e.key === 'Tab') {
                if (items.length > 0) { e.preventDefault(); if (currentFocusCustomer > -1) items[currentFocusCustomer].click(); else items[0].click(); }
            } else if (e.key === 'Escape') {
                if (currentCustomer) selectCustomer(currentCustomer);
                else { customerInputContainer.style.display = 'none'; customerDisplay.style.display = 'inline-block'; }
            }
        });

        const searchInput = document.getElementById('searchInput');
        const qtyInput = document.getElementById('qtyInput');
        const autocompleteList = document.getElementById('autocomplete-list');
        const selectedSkuInput = document.getElementById('selectedSku');

        searchInput.addEventListener('input', function() {
            const val = this.value; autocompleteList.innerHTML = ''; selectedSkuInput.value = ''; currentFocusItem = -1;
            if (!val) return false;
            let scoredMatches = catalogData.map(item => { return { item, score: getMatchScore(val, item.name) }; }).filter(m => m.score > 0);
            scoredMatches.sort((a, b) => b.score - a.score);
            scoredMatches.forEach((match, index) => {
                const optionDiv = document.createElement("div");
                if (index === 0) { optionDiv.classList.add('active'); currentFocusItem = 0; }
                optionDiv.innerHTML = `<span class="item-name">${match.item.name}</span> <span class="item-uom">${match.item.uom}</span>`;
                optionDiv.addEventListener("click", () => selectItem(match.item));
                autocompleteList.appendChild(optionDiv);
            });
        });

        searchInput.addEventListener('keydown', function(e) {
            const items = autocompleteList.getElementsByTagName('div');
            if (e.key === 'ArrowDown') { currentFocusItem = addActive(items, ++currentFocusItem); } 
            else if (e.key === 'ArrowUp') { currentFocusItem = addActive(items, --currentFocusItem); } 
            else if (e.key === 'Enter' || e.key === 'Tab') {
                if (items.length > 0) { e.preventDefault(); if (currentFocusItem > -1) items[currentFocusItem].click(); else items[0].click(); }
            }
        });

        qtyInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); addToCart(); } });

        function selectItem(item) {
            searchInput.value = `${item.name} (${item.uom})`; selectedSkuInput.value = item.sku;
            autocompleteList.innerHTML = ''; qtyInput.focus();
        }

        document.addEventListener("click", function (e) {
            if (e.target !== searchInput) autocompleteList.innerHTML = '';
            if (e.target !== customerInput && e.target !== customerDisplay && e.target !== customerEditBtn) {
                customerAutocompleteList.innerHTML = '';
                if (customerInputContainer.style.display === 'block') {
                    if (currentCustomer) selectCustomer(currentCustomer); 
                    else { customerInputContainer.style.display = 'none'; customerDisplay.style.display = 'inline-block'; }
                }
            }
            if (deliveryInputContainer.style.display === 'flex') {
                if (!deliveryInputContainer.contains(e.target) && e.target !== deliveryDisplay && e.target !== deliveryEditBtn) {
                    deliveryInputContainer.style.display = 'none'; deliveryDisplay.style.display = 'inline-block'; deliveryEditBtn.style.display = 'inline-block';
                }
            }
            const modal = document.getElementById('historyModal');
            if (e.target === modal) closeHistoryPopup();
        });

        function addToCart() {
            const selectedSku = document.getElementById('selectedSku').value;
            const rawQty = parseFloat(qtyInput.value);

            if (!selectedSku) { alert("Please select an item from the search results."); searchInput.focus(); return; }
            if (isNaN(rawQty) || rawQty <= 0) { alert("Please enter a valid quantity."); qtyInput.focus(); return; }

            const formattedQty = Number.isInteger(rawQty) ? rawQty.toString() : rawQty.toFixed(2);
            const product = catalogData.find(p => p.sku === selectedSku);
            
            orderCart.push({ sku: product.sku, name: product.name, variant: product.variant, qty: formattedQty, uom: product.uom, note: "" });
            renderCart(); searchInput.value = ''; selectedSkuInput.value = ''; qtyInput.value = ''; searchInput.focus(); 
        }

        function renderCart() {
            const tbody = document.getElementById('cartBody'); tbody.innerHTML = '';
            if (orderCart.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #6b7280; padding: 40px 20px;"><img src="https://res.cloudinary.com/dmebrkcru/image/upload/f_auto,q_auto/baby_bear_white_bg_xq7e72" style="width: 100px; display: block; margin: 0 auto 12px auto; opacity: 0.5; filter: grayscale(30%);"><span style="font-weight: 500; font-size: 0.9rem; color: var(--text-muted);">No items added to this order yet.</span></td></tr>`;
                return;
            }
            orderCart.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `<td style="text-align: center; font-weight: 600; color: var(--text-muted);">${index + 1}</td><td style="font-weight: 600; color: var(--text-main);">${item.name}</td><td id="qty-cell-${index}" style="font-weight: 500;">${item.qty}</td><td><span style="font-size: 0.775rem; color: var(--text-muted); background: var(--bg-color); padding: 2px 6px; border-radius: 4px; font-weight: 600;">${item.uom}</span></td><td class="note-cell" title="${item.note || ''}">${item.note || '-'}</td><td class="actions-cell" id="action-cell-${index}"><button class="btn-sm btn-outline" onclick="editItem(${index})">✏</button><button class="btn-sm btn-outline" onclick="editNote(${index})">📝 Note</button><button class="btn-sm btn-danger btn-outline" style="color: var(--danger);" onclick="deleteItem(${index})">🗑</button></td>`;
                tbody.appendChild(row);
            });
        }

        function clearAllItems() { if (orderCart.length > 0 && confirm("Are you sure you want to clear the entire order?")) { orderCart = []; renderCart(); } }
        function deleteItem(index) { orderCart.splice(index, 1); renderCart(); }

        function editItem(index) {
            const qtyCell = document.getElementById(`qty-cell-${index}`); const actionCell = document.getElementById(`action-cell-${index}`);
            qtyCell.innerHTML = `<input type="number" class="inline-edit-input" id="edit-qty-${index}" value="${orderCart[index].qty}" step="0.1" min="0.1">`;
            actionCell.innerHTML = `<button class="btn-sm" style="background-color: var(--success); color: white; border: none;" onclick="saveItem(${index})">Save</button><button class="btn-sm btn-outline" onclick="renderCart()">Cancel</button>`;
            const editInput = document.getElementById(`edit-qty-${index}`); editInput.focus(); editInput.select();
            editInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') saveItem(index); if (e.key === 'Escape') renderCart(); });
        }

        function editNote(index) {
            const newNote = prompt(`Enter note for ${orderCart[index].name}:`, orderCart[index].note || "");
            if (newNote !== null) { orderCart[index].note = newNote.trim(); renderCart(); }
        }

        function saveItem(index) {
            const editInput = document.getElementById(`edit-qty-${index}`); const rawQty = parseFloat(editInput.value);
            if (isNaN(rawQty) || rawQty <= 0) { alert("Please enter a valid quantity."); editInput.focus(); return; }
            orderCart[index].qty = Number.isInteger(rawQty) ? rawQty.toString() : rawQty.toFixed(2); renderCart();
        }
        
        function generateOrderNumber() {
            const now = new Date();
            const datePrefix = String(now.getFullYear()).slice(2) + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
            let maxN = 0;
            transactionHistory.forEach(order => {
                if (order.orderNumber && order.orderNumber.startsWith("RO" + datePrefix)) {
                    const nPart = parseInt(order.orderNumber.substring(8, 12), 10);
                    if (nPart > maxN) maxN = nPart;
                }
            });
            const chars = "ABCDEFGHJKMNPQRSTUVWXYZ"; 
            let xxx = ""; for (let i = 0; i < 3; i++) xxx += chars.charAt(Math.floor(Math.random() * chars.length));
            return "RO" + datePrefix + String(maxN + 1).padStart(4, '0') + xxx;
        }

        function resetAppUI() {
            orderCart = []; currentOrderNumber = null;
            document.getElementById('editModeContainer').style.display = 'none';
            currentCustomer = null; customerDisplay.innerText = "click here"; customerDisplay.style.color = "var(--primary)";
            customerDisplay.style.textDecoration = "underline"; customerEditBtn.style.display = "none"; customerInput.value = "";
            currentDeliveryDate = getTomorrowDateString(); updateDeliveryDisplay();
            renderCart();
        }

        function submitOrder() {
            if (orderCart.length === 0) { alert("Your order is empty!"); return; }
            if (!currentCustomer && !confirm("No customer selected. Do you want to proceed anyway?")) return;

            const isUpdate = !!currentOrderNumber;
            if (!isUpdate) { currentOrderNumber = generateOrderNumber(); }

            const transactionData = {
                orderNumber: currentOrderNumber,
                timestamp: new Date().toLocaleString(),
                customer: currentCustomer || "No Customer",
                deliveryDate: currentDeliveryDate,
                cart: JSON.parse(JSON.stringify(orderCart)) 
            };

            if (isUpdate) {
                const idx = transactionHistory.findIndex(t => t.orderNumber === currentOrderNumber);
                if (idx !== -1) transactionHistory[idx] = transactionData;
            } else { transactionHistory.push(transactionData); }

            localStorage.setItem('npn_order_history', JSON.stringify(transactionHistory));

            if (GAS_DB_URL && !GAS_DB_URL.includes('PASTE_YOUR')) {
                fetch(GAS_DB_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(transactionData)
                }).catch(err => console.error("Database sync failed", err));
            } else {
                alert("⚠️ Warning: Your Database URL is not set. Order is only saved locally!");
            }

            sendTelegramOrderAlert(currentCustomer, currentDeliveryDate, orderCart);
            resetAppUI();
        }

        function openHistoryPopup() { document.getElementById('historyModal').style.display = 'flex'; populateHistoryList(); }
        function closeHistoryPopup() { document.getElementById('historyModal').style.display = 'none'; }

        function populateHistoryList() {
            const listContainer = document.getElementById('historyList'); listContainer.innerHTML = '';
            if (transactionHistory.length === 0) { listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 2rem; font-weight: 500;">No previous transactions found.</p>'; return; }
            const displayHistory = [...transactionHistory].reverse();

            displayHistory.forEach((transaction, reversedIndex) => {
                const originalIndex = transactionHistory.length - 1 - reversedIndex;
                const custName = transaction.customer || "No Customer";
                const delDateStr = transaction.deliveryDate ? formatDateDisplay(transaction.deliveryDate) : "Unknown Date";
                const itemDiv = document.createElement('div'); itemDiv.className = 'history-item';
                itemDiv.innerHTML = `
                    <div class="history-item-details">
                        <span class="history-item-time">${transaction.timestamp}</span>
                        <span class="history-item-sub">👤 ${custName} • 📅 Delivery on: ${delDateStr} • 📦 ${transaction.cart.length} item(s)</span>
                    </div>
                    <div class="actions-cell">
                        <button class="btn-sm btn-success" title="Export to CSV" onclick="downloadHistoryCSV(${originalIndex})">CSV</button>
                        <button class="btn-sm btn-outline" title="Lihat & edit pesanan" onclick="loadHistoryItem(${originalIndex})">Load</button>
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });
        }

        function downloadHistoryCSV(index) {
            const transaction = transactionHistory[index];
            if (!transaction || !transaction.cart) return;

            let csvContent = "data:text/csv;charset=utf-8,product,variant,sku,qty,uom,note\n";
            const sanitize = (str) => { return str ? String(str).replace(/"/g, "").replace(/,/g, ".") : ""; };
            
            transaction.cart.forEach(item => { 
                csvContent += `${sanitize(item.name)},${sanitize(item.variant)},${sanitize(item.sku)},${sanitize(item.qty)},${sanitize(item.uom)},${sanitize(item.note || "")}\n`; 
            });

            const currentDeliveryDate = transaction.deliveryDate;
            let deliveryFormatted = "UnknownDate";
            if (currentDeliveryDate) {
                let dObj;
                if (currentDeliveryDate.length === 10 && currentDeliveryDate.indexOf('-') === 4) {
                    const parts = currentDeliveryDate.split('-');
                    dObj = new Date(parts[0], parts[1] - 1, parts[2]);
                } else {
                    dObj = new Date(currentDeliveryDate);
                }
                
                if (!isNaN(dObj.getTime())) {
                    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                    const dd = String(dObj.getDate()).padStart(2, '0');
                    const mmm = months[dObj.getMonth()];
                    const yy = String(dObj.getFullYear()).substring(2);
                    deliveryFormatted = `${dd}${mmm}${yy}`;
                }
            }
            
            let timestampFormatted = "UnknownTime";
            const tDate = new Date(transaction.timestamp);
            if (!isNaN(tDate.getTime())) {
                timestampFormatted = `${tDate.getFullYear()}${String(tDate.getMonth()+1).padStart(2,'0')}${String(tDate.getDate()).padStart(2,'0')} ${String(tDate.getHours()).padStart(2,'0')}_${String(tDate.getMinutes()).padStart(2,'0')}_${String(tDate.getSeconds()).padStart(2,'0')}`;
            } else {
                timestampFormatted = transaction.timestamp.replace(/[\/\\:]/g, '_');
            }

            const safeCustomerName = transaction.customer && transaction.customer !== "No Customer" ? transaction.customer : "New";
            const fileName = `${safeCustomerName} for ${deliveryFormatted} - ${timestampFormatted}.csv`;

            const encodedUri = encodeURI(csvContent); 
            const link = document.createElement("a"); 
            link.setAttribute("href", encodedUri); 
            link.setAttribute("download", fileName);
            document.body.appendChild(link); 
            link.click(); 
            document.body.removeChild(link);
        }

        function loadHistoryItem(index) {
            if (orderCart.length > 0 && !confirm("Loading a previous transaction will replace your current cart. Continue?")) return;
            const loadedTransaction = transactionHistory[index];
            orderCart = JSON.parse(JSON.stringify(loadedTransaction.cart));
            
            currentOrderNumber = loadedTransaction.orderNumber;
            
            document.getElementById('editModeLabel').innerText = `Edit Mode for ${currentOrderNumber}`;
            document.getElementById('editModeContainer').style.display = 'flex';

            if (loadedTransaction.customer && loadedTransaction.customer !== "No Customer") { selectCustomer(loadedTransaction.customer); } 
            else { currentCustomer = null; customerDisplay.innerText = "click here"; customerDisplay.style.color = "var(--primary)"; customerDisplay.style.textDecoration = "underline"; customerEditBtn.style.display = "none"; }
            
            currentDeliveryDate = loadedTransaction.deliveryDate ? loadedTransaction.deliveryDate : getTomorrowDateString();
            updateDeliveryDisplay(); renderCart(); closeHistoryPopup();
        }

        renderCart();

        function sendTelegramOrderAlert(customer, deliveryDate, cart) {
            if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('PASTE_YOUR')) return;
            let message = `🚨 *New Order Saved!*\n👤 *Customer:* ${customer || "No Customer"}\n📅 *Delivery Date:* ${formatDateDisplay(deliveryDate)}\n\n📦 *Items:*\n`;
            cart.forEach((item, index) => { message += `${index + 1}. ${item.name} - ${item.qty} ${item.uom}${item.note ? ` _(Note: ${item.note})_` : ''}\n`; });
            
            fetch(GAS_WEB_APP_URL, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message })
            }).catch(err => console.error("Failed to route message through Google Script", err));
        }
    </script>
</body>
</html>
